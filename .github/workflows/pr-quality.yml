name: PR quality

on:
  pull_request:
    branches:
      - main
    # Avoid running heavy CI on markdown/docs-only changes
    paths-ignore:
      - "**.md"
      - "docs/**"

# Cancel obsolete, in-flight runs when new commits are pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and security scan
    runs-on: ubuntu-latest

    # HARD CAP: Prevents hanging scripts from consuming runner queue hours
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Standard fetch depth (1) is faster; use fetch-depth: 0 ONLY if gitleaks requires full history
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3

      - name: Run gosec
        # Running via official Go binary step avoids running arbitrary composite action scripts
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
