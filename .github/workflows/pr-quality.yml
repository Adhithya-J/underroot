name: PR quality

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for gitleaks

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Keep the project on its declared Go toolchain.
          go-version: '1.23.12'
          cache: true

      - name: Verify Go toolchain
        run: go version && go env GOVERSION GOROOT GOTOOLCHAIN

      - name: Run vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2.9+ supports the Go 1.26 standard library installed on hosted runners.
          version: v2.12

      - name: Scan for secrets with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
