version: "2"

run:
  tests: true

formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true

linters:
  default: none
  enable:
    - gosec
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - bodyclose
    - revive
    - gocritic
    - misspell
    - unused
  settings:
    gosec:
      excludes:
        - G104
      severity: medium
      confidence: medium
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      severity: warning
      rules:
        - name: exported
          severity: warning
        - name: indent-error-flow
          severity: warning
        - name: unused-parameter
          severity: warning
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - bodyclose

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
